<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="header">
    <h1>Student Details Management</h1>
    <p>Add, view, update and delete student records</p>
</header>

<main class="container">

    <section class="card">
        <h2 id="formTitle">Add New Student</h2>

        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div class="form-grid">
                <div class="field">
                    <label for="firstName">Student First Name</label>
                    <input type="text" id="firstName"
                           maxlength="100"
                           placeholder="Enter student first name" required>
                </div>

                <div class="field">
                    <label for="lastName">Student Last Name</label>
                    <input type="text" id="lastName"
                           maxlength="100"
                           placeholder="Enter student last name" required>
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           maxlength="150"
                           placeholder="Enter email" required>
                </div>

                <div class="field">
                    <label for="mobile">Mobile Number</label>
                    <input type="text" id="mobile"
                           maxlength="10"
                           placeholder="Enter mobile number">
                </div>

                <div class="field">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob"
                           maxlength="15"
                           placeholder="Enter date of birth">
                </div>

                <div class="field">
                    <label for="course">Course</label>
                    <input type="text" id="course"
                           maxlength="100"
                           placeholder="e.g. Computer Science" required>
                </div>

                <div class="field">
                    <label for="marks">Marks</label>
                    <input type="number" id="marks"
                           min="1" max="100"
                           placeholder="Enter marks">
                </div>
            </div>

            <div class="actions">
                <button type="submit" id="submitBtn">
                    Add Student
                </button>

                <button type="button" id="cancelBtn"
                        class="secondary hidden">
                    Cancel Edit
                </button>
            </div>
        </form>
    </section>

    <section class="card">
        <div class="table-heading">
            <div>
                <h2>Student Records</h2>
                <p id="studentCount">Loading students...</p>
            </div>

            <button type="button" id="refreshBtn"
                    class="secondary">
                Refresh
            </button>
        </div>

        <p id="message" role="status" aria-live="polite"></p>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Mobile Number</th>
                    <th>Date of Birth</th>
                    <th>Course</th>
                    <th>Marks</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody id="studentTable">
                <tr>
                    <td colspan="6">Loading students...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    Student Details Management System | Spring Boot CRUD
</footer>

</body>
</html>
