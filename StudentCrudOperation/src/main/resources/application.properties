spring.application.name=StudentCrudOperation

#Database details
spring.datasource.name=crud_operation
spring.datasource.url=jdbc:mysql://localhost:3306/crud_operation?autoReconnect=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernet.dialect=org.hibernet.dialect.MySQL5Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

